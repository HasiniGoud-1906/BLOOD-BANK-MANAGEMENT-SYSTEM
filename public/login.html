<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login - Blood Bank Management System
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- Navigation -->

    <nav class="navbar">

        <div class="logo">
            🩸 Blood Bank
        </div>


        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="register.html">
                Register
            </a>

        </div>

    </nav>



    <!-- Login Section -->

    <section class="form-section">

        <div class="form-container">


            <h1>
                Welcome Back
            </h1>


            <p class="form-subtitle">
                Login to your Blood Bank account
            </p>



            <form id="loginForm">


                <!-- Email -->

                <div class="form-group">

                    <label for="loginEmail">
                        Email
                    </label>


                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>



                <!-- Password -->

                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>


                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >

                </div>



                <!-- Login Button -->

                <button
                    type="submit"
                    class="form-button"
                >

                    Login

                </button>



                <!-- Message -->

                <p id="loginMessage"></p>


            </form>



            <p class="login-link">

                Don't have an account?

                <a href="register.html">
                    Register here
                </a>

            </p>


        </div>

    </section>



    <!-- Footer -->

    <footer>

        <p>
            © 2026 Blood Bank Management System
        </p>

    </footer>


    <script src="js/app.js"></script>


</body>

</html>
