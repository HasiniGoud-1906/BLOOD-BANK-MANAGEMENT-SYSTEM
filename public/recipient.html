<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Recipient Dashboard - Blood Bank</title>

    <link rel="stylesheet"
        href="css/style.css">

</head>

<body class="recipient-page">

    <header class="recipient-header">

        <h1>Blood Bank Management System</h1>

        <button onclick="logout()">
            Logout
        </button>

    </header>


    <main class="recipient-main">

        <h2>Recipient Dashboard</h2>

        <p id="recipientWelcome">
            Welcome Recipient
        </p>


        <!-- =================================
             RECIPIENT PROFILE
        ================================== -->

        <section class="recipient-section">

            <h2>My Profile</h2>

            <div id="recipientProfile">

                Loading profile...

            </div>

        </section>


        <!-- =================================
             BLOOD REQUEST FORM
        ================================== -->

        <section class="recipient-section">

            <h2>Request Blood</h2>

            <form id="bloodRequestForm">

                <label for="requestBloodGroup">
                    Blood Group
                </label>

                <select id="requestBloodGroup"
                        required>

                    <option value="">
                        Select Blood Group
                    </option>

                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>

                </select>


                <label for="requestQuantity">
                    Quantity (Units)
                </label>

                <input
                    type="number"
                    id="requestQuantity"
                    min="1"
                    required
                >


                <button type="submit">
                    Submit Blood Request
                </button>

            </form>


            <p id="requestMessage"></p>

        </section>


        <!-- =================================
             MY BLOOD REQUESTS
        ================================== -->

        <section class="recipient-section">

            <h2>My Blood Requests</h2>

            <div id="myBloodRequests">

                Loading requests...

            </div>

        </section>


        <section class="recipient-section">
    <h2>Search Blood Availability</h2>

    <label for="searchBloodGroup">
        Select Blood Group
    </label>

    <select id="searchBloodGroup">
        <option value="">All Blood Groups</option>
        <option value="A+">A+</option>
        <option value="A-">A-</option>
        <option value="B+">B+</option>
        <option value="B-">B-</option>
        <option value="AB+">AB+</option>
        <option value="AB-">AB-</option>
        <option value="O+">O+</option>
        <option value="O-">O-</option>
    </select>

    <button type="button" id="searchBloodButton">
        Search
    </button>

    <div id="bloodSearchMessage"></div>

    <h2>Available Blood Stock</h2>

    <div id="recipientBloodStock"
         class="blood-stock-container">
        Loading blood stock...
    </div>
</section>
    </main>


    <script src="js/app.js"></script>

</body>

</html>
